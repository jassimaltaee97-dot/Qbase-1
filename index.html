<script>
const cards=[{"section":"Exam 1 a","front":"<div class=\"stem\">21. Regarding the carotid vessels<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> CT is better than MRI in imaging the vessels at the thoracic inlet because of less bony artifact<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> High frequency probe is used to assess the carotid artery bifurcation<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Selective catheterisation of external carotid artery is performed to assess supply to vascular tumours of neck<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Intracranial pathology can cause enlargement of external carotid artery branches<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Right subclavian artery may arise as last branch of the arch in 5% of people<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE: MRI has the advantage in imaging the vessels at the thoracic inlet without any degradation from bony artefact<\/div><div class=\"expl-line\">B. TRUE<\/div><div class=\"expl-line\">C. TRUE<\/div><div class=\"expl-line\">D. TRUE<\/div><div class=\"expl-line\">E. FALSE: The right subclavian artery may arise at the last branch of the arch in approximately 0.5% of people.<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">25. At the wrist<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The pisiform is a sesamoid bone.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The capitate articulates with the third and fourth metacarpals.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The lunate is the second carpal bone to ossify.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The triangular fibrocartilage is attached to the radial styloid process.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The radiocarpal joint freely communicates with midcarpal joint.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE<\/div><div class=\"expl-line\">B. TRUE<\/div><div class=\"expl-line\">C. FALSE: The hamate is the second carpal bone to ossify<\/div><div class=\"expl-line\">D. FALSE: The triangular fibrocartilage is attached to the ulnar styloid process<\/div><div class=\"expl-line\">E. FALSE: The radiocarpal joint does not normally communicate with the midcarpal joint<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">27. In relation to the penis<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The urethra is surrounded by a ring of tissue called the corpus spongiosum<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The corpora cavernosa are covered by a fibrous coat, the tunica albuginea.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The corpora cavernosa are commonly injected with contrast to investigate the erectile dysfunction<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The penis receives three pairs of arteries, all from the internal pudendal artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Lymph from penile skin drains to superficial inguinal nodes.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. TRUE D. TRUE E. TRUE<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">28. The uterus<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Is retroverted in the majority of individuals.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Is covered with peritoneum in its upper third only.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Is supplied by an artery directly from the aorta.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Has the round ligament attached to the junction of uterus and uterine tube.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Is bicornuate if there is incomplete fusion of the paramesonephric ducts.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">The uterus is usually anteverted<\/div><div class=\"expl-line\">The majority of the uterus is covered in peritoneum<\/div><div class=\"expl-line\">The uterine artery is a branch of the internal iliac artery<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">29. Regarding the pancreas<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It is closely related to the splenic vein.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Venous drainage is partially by the superior mesenteric vein.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The tail lies within two layers of the lienorenal ligament.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The uncinate process is not supplied by the splenic artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Lymphatic drainage is to para-aortic nodes.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">The splenic vein is posterior to the pancreas.<\/div><div class=\"expl-line\">Lymphatic drainage from the pancreas is to the superior mesenteric and coeliac nodes<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">30. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The adrenal gland lie within the perirenal space<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The adrenal glands lie within the renal capsule<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Gerota’s fascia fuse medially with the adventitia of renal vessels<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The anterior pararenal space communicates across the midline<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The posterior pararenal space communicate across the midline.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">The adrenal glands lie within the Gerota&#x27;s fascia but outside of the renal capsule<\/div><div class=\"expl-line\">The posterior pararenal space is limited medially by the psoas fascia<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">31. Regarding the gallbladder and biliary tree<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The cystic duct is about 2-3cm long<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The small cystic vein pass directly from the body of the gallbladder into the liver substance.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The right and left hepatic ducts may fail to unit giving double hepatic ducts<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A Phrygian cap is a diverticulum within the gallbladder.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Two cystic veins accompany the cystic artery.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">A Phrygian cap is the appearance of the gallbladder fundus folded over on itself<\/div><div class=\"expl-line\">Cystic veins are uncommon but when they occur they run into right branch of the portal vein<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">32. The spleen<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Develops from ventral mesogastriurm<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Normally has a blood supply from the superior mesenteric artery.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Has a notched posterior border<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Receives sympathetic fibers From the coeliac plexus<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Is related to the tail of the pancreas on its posterior surface.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE The spleen develops from dorsal mesogastrium<\/div><div class=\"expl-line\">B. FALSE The blood supply to the spleen is normally from the coeliac artery<\/div><div class=\"expl-line\">C. FALSE The anterior border of the spleen is notched<\/div><div class=\"expl-line\">D. TRUE<\/div><div class=\"expl-line\">E. FALSE The spleen is related to the tail of the pancreas at the hilum<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">33. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Costal cartilage calcification is usually marginal bands in males and in a central tonguc in Females.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Cervical ribs are Found in l0-20% of normal subjects.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The left paraspinal line is larger than the right paraspinal line.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Rhomboid Fossa is present at the inferomedial aspect of the clavicle.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> End plates of cervical spine vertebra are well seen on PA views.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE<\/div><div class=\"expl-line\">B. FALSE Cervical ribs are seen in only 1-2% of subjects.<\/div><div class=\"expl-line\">C. TRUE Left paraspinal line is 10 mm and right is 3mm.<\/div><div class=\"expl-line\">D. TRUE Rhomboid Fossa is seen in 0.5% of cases.<\/div><div class=\"expl-line\">E. FALSE They are well seen on AP views.<\/div><\/div>","due":39},{"section":"Exam 1 a","front":"<div class=\"stem\">34. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The right ventricular chamber is flattened from side to side.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The lower part of the right ventricle normally touches the lower part of the sternum in lateral view.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The right ventricle has a smooth inflow tract and muscular outflow tract.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The pulmonary valve has two anterior and one posterior cusp<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The pulmonary valve class=\"option\"><span class=\"letter\">C.<\/span> Use 35 x 40 cm film<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Gonadal protection should always be used<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Centre midway between lower costal margin and iliac crest<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">A erect CXR and supine AXR are appropriate for excluding a perforation.<\/div><div class=\"expl-line\">Abdominal films are performed in inspiration so that more of the abdomen can be seen.<\/div><div class=\"expl-line\">A 35 x 43 cm film is used.<\/div><div class=\"expl-line\">Only men receive gonadal protection.<\/div><\/div>","due":32},{"section":"Exam 1 b","front":"<div class=\"stem\">41. A medio-lateral oblique mammogram is adequately positioned when<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Pectoralis major muscle can be visualized down to the level of the inferomedial surface of the breast.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The nipple is seen in profile.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The axillary tail is included.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Compression is applied along direction of the pectoralis muscle<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The infra-mammary fold is not visualized.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE The pectoralis muscle should be visualised down to the level of the nipple.<\/div><div class=\"expl-line\">B. TRUE<\/div><div class=\"expl-line\">C. TRUE<\/div><div class=\"expl-line\">D. FALSE Compression is applied perpendicular to the long axis of the pectoralis muscle.<\/div><div class=\"expl-line\">E. FALSE The inframammary fold should always be visualised<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">42. When imaging the thyroid gland<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Tc-pertechnetate can be used to asses thyroid function<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 123I-sodium iodide is organified in the thyroid<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Uptake of 99mTc-pertechnetate is reduced if the patient has recently received intravenous contrast.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> It is not essential to mark the sternal notch.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 160 MBq of 99mTc-pertechnetate is routinely administrated.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE 123 I-sodium iodide is used to assess thyroid function<\/div><div class=\"expl-line\">B. TRUE<\/div><div class=\"expl-line\">C. TRUE<\/div><div class=\"expl-line\">D. FALSE It is essential to use sternal marker to demonstrate retrosternal goiters<\/div><div class=\"expl-line\">E. FALSE 60 MBq of 99mTc-pertechnatate is routinely used.<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">43. When performing sialogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> following extravasation, lipidol can remain in the soft tissues for years<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Side effects other than pain are more common and more severe with lipidol than water soluble contrast media.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Pain is more common with lipidol than with water soluble contrast media.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> It is easier to over distend a chronically diseased gland than a healthy one.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Acetic acid is an appropriate sialogogue.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE<\/div><div class=\"expl-line\">B. TRUE<\/div><div class=\"expl-line\">C. FALSE Pain is more common with water soluble contrast media.<\/div><div class=\"expl-line\">D. FALSE Chronically diseased glands are desensitized to pain.<\/div><div class=\"expl-line\">E. FALSE Ascorbic acid is used as a sialogogue<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">44. The Following statements are true when imaging the peripheral venous system<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 125iodine-labelled fibrinogen is taken up into developing thrombus.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A deep vein thrombosis is present in 20% of patients with a negative D-dimer assay.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The superficial Femoral vein is duplicate in 5% of patients.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Reverse flow in the long saphenous vein during a valsalva maneuver is normal.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Several sequential 2-d time-of-flight MRI images can be obtained in a single breath hold<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Less than 5% of patients with a negative D-dimer have a DVT. 15% of the population have duplex superficial<\/div><div class=\"expl-line\">femoral veins. Reverse flow in the long saphenous vein during valsalva manouevres indicate reflux at the<\/div><div class=\"expl-line\">sapheno-femoral junction.<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">45. Regarding the intravenous pyelogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The prostatic urethra should be included on the preliminary full length film.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The patient should be nil by mouth for five hours prior to the study.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The dose of contrast media is 7mgs per kilogram in a 6 years old child<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The nephrogram is due to contrast in the renal glomeruli.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Shoulder pain can be relieved by adducting the arm.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. FALSE E. FALSE<\/div><div class=\"expl-line\">Dehydration is no longer considered applicable and should be avoided especially if there is evidence of renal<\/div><div class=\"expl-line\">impairment, multiple myeloma, or diabetis rnelitis. Food however should be avoided for five hours prior to the<\/div><div class=\"expl-line\">study. The correct dose for a 6 year old child is 1-2 mgs per kilogram, but more required in a neonates relaively<\/div><div class=\"expl-line\">poor concentrating ability of the nephron. The nephrogram is due to contrast in the proximal convoluted tubules.<\/div><div class=\"expl-line\">Abduction helps empty the contrast media from the veins of the arm.<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">46. The following are true of dynamic renal scintigraphy<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The acquisition of data during the blood flow phase allows the estimation of renal blood flow as a percentage of cardiac output.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The uptake phase of 99mTc-DTPA reflects effective renal plasma flow.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 99mTc-MAG-3 allows estimation of the glomerular filtration rate.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Following injection of frusemide. a fall in renal activity to less than -75% of its maximum value at 10 minutes indicates normal drainage.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 123I-Hippuran is the agent of choice<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">The uptake phase of 99mTc-DTPA reflects the glomerulo-filtration rate.<\/div><div class=\"expl-line\">80% of 99mTc-MAG3 is secreted by the proximal convuluted tubules, allowing the detection of scarring, and the<\/div><div class=\"expl-line\">estimation of differential function and effective renal plasma flow. Following injection of frusemide, normal<\/div><div class=\"expl-line\">drainage is indicated by a reduction to less than 75% at 10 minutes and 50% at 20 minutes. Unfortunately ,1231-<\/div><div class=\"expl-line\">Hippuran is prohibitively expensive and therefore rarely used.<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">47. Regarding carotid doppler examinations<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Diastolic flow reversal is normal in the external carotid artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The maximum peak systolic velocity of the common carotid artery should not exceed 0.5 m/second.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> For spectral doppler studies, an interrogation angle of 90% is most accurate.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The orbit provides an acoustic window to the carotid syphon.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Velocity curves are lower in the ophthalmic artery than the internal carotid artery.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">The maximum peak systolic velocity of the common carotid is 1 - 1.2 m/s. 60-70 degrees is the most accurate<\/div><div class=\"expl-line\">angle of interrogation.<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">48. Regarding cerebral angiography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The risk of death or permanent neurological deficit in the hands of an experienced neuroradiologist is 0.2%.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Meglumine salt contrast media is more neurotoxic than sodium salt contrast media.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Transient cortical blindness is a recognized complication.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Compression of the contralateral carotid artery allows settlement of the patency of the anterior cerebral artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The common carotid artery arises from the brachiocephalic trunk in 2 %<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">Two recent studies quote a 1.2% and 5.2% risk of death or permanent neurological deficit. Sodium salt ionic<\/div><div class=\"expl-line\">contrast media is more neurotoxic than meglumine salt contrast. The anterior communicating artery is patent if<\/div><div class=\"expl-line\">contra-lateral flow is demonstrated. The common carotid artery arises from the brachiocephalic trunk in 25-30%.<\/div><\/div>","due":43},{"section":"Exam 1 b","front":"<div class=\"stem\">49. When imaging the pituitary gland<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The anterior lobe is high signal on TIW MRI sequences in adults.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The pituitary gland typically enhance poorly with Gadolinium.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The pituitary stalk lies anterior to the optic chiasm.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The superior border of the pituitary is upwardly convex during pregnancy and puberty.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The anterior pituitary is often high signal on T1W MRI sequences in neonates.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\ ront":"<div class=\"stem\">42. When imaging the parathyroid glands<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> High resolution converging collimation is used<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A dual isotope capability is essential<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 201 Tl is imaged at a window of 70 KeV<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The patient should be encouraged to swallow during the acquisition time to clear technetium contaminated saliva<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Iodine containing skin ointment can suppress thyroid uptake<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">The study can be done in two separate stages Movement artefact should be eliminated if possible.<\/div><\/div>","due":43},{"section":"Exam 2 b","front":"<div class=\"stem\">43. Regarding parotid sialography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> injection of contrast media should cause no discomfort<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Acute inflammation is a contraindication.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Preliminary films should include an occlusal view.<\/div><div class=\"option\"><span cl t true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">The cisterna chyli is a 5 X 0.5 cm structure most commonly seen lying between the aorta and the IVC on CT.<\/div><div class=\"expl-line\">Lymphatic drainage most commonly crosses the midline from right to left.<\/div><\/div>","due":43},{"section":"Exam 2 b","front":"<div class=\"stem\">45. Regarding the intravenous pyelogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Calyceal detail is better demonstrated on ultrasound<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> An inferior vena caval filter is a contraindication to compression<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The maximum nephrogram density is dependent on the peak plasma level of contrast media, the glomerulo filtration rate, and the rate of resorbtion of sodium and water in the proximal convulated tubial<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> High osmolar contrast media produces greater pelvicalyceal distension than low osmolar contrast media.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The peak nephrogram phase occurs slightly earlier with low osmolar contrast media than high osmolar contrast media<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">Calyceal detail is much greater on an 1VP than with ultrasound.<\/div><div class=\"expl-line\">Low osmolar contrast media delivers a smaller osmotic load so that diuresis is less.<\/div><div class=\"expl-line\">Compression therefore is more important with non-ionic contrast media.<\/div><\/div>","due":43},{"section":"Exam 2 b","front":"<div class=\"stem\">46. The following are true of a Technetium labelled HMPOA brain scan<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> HMPOA dose not cross the blood brain area.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Tomographic images are obtained at 5 minutes.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Inter and intra-ictal scans are indicated to demonstrate an epileptogenic Focus<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> HMPOA localises in the brain in proportion to brain activity<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Rapid injection is contraindicated.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false artery<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The oesophageal plexus of nerves is Formed by both phrenic and vagus nerves.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The right phrenic nerve enters the thorax lateral to the right brachiocephalic vein<\/div><div class=\"expl-line\">The oesophageal plexus of nerves is formed only by the vagus nerve<\/div><div class=\"expl-line\">Refs:<\/div><\/div>","due":42},{"section":"Exam 3 a","front":"<div class=\"stem\">40. The following structures belong to the second pharyngeal arch<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Stylopharyngcus muscle<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Cartilages of larynx<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Facial nerve<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Styloid process<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Stapedius muscle<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"let  cava<\/div><div class=\"expl-line\">An incomplete septum separates the testes within the scrotum<\/div><div class=\"expl-line\">Refs:<\/div><\/div>","due":43},{"section":"Exam 3 a","front":"<div class=\"stem\">34. The Following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The right coronary artery arises from the posterior sinus<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The right coronary artery lies in the right atrioventricular groove as the marginal artery.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The right coronary artery anastomoses with the left in the anterior interventricular groove.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The conus artery to the pulmonary trunk is a branch of the right ventricular artery<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The SA node and AV node are both supplied by right coronary artery<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The right coronary artery arises from the single anterior sinus also called the right coronary sinus.<\/div><div class=\"expl-line\">The anastomosis lies at the posterior interventricular groove.<\/div><div class=\"expl-line\">Refs:<\/div><\/div>","due":43},{"section":"Exam 3 b","front":"<div class=\"stem\">41. Regarding ultrasound of the thyroid<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The thyroid is of lower echogenicity than the strap muscle<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 7-10 MHz linear array probe is appropriate<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Normal parathyroid glands are usually 0.5 – 1 cm in size<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Normal parathyroid gland are hypoechoic compared to the thyroid<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The lateral lobes tend to be shorter in thin people<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The thyroid is hyper-echoic compared with the strap muscles.<\/div><div class=\"expl-line\">Normal parathyroid glands are less than 5 mms. Normal parathyroid glands are isoechoic with the thyroid.<\/div><div class=\"expl-line\">The lateral lobes tend to be longer in thin people.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">42. In dacrocystography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The cannula should be inserted no more than 3-4 mm into the inferior cannuliculus<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The upper cannuliculus is normally not demonstrated by injection into the inferior cannuliculus<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The inferior dict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Retrosternal or sublingual thyroids can both be obscured<\/div><div class=\"expl-line\">A contrast injection within 2 weeks will suppress the thyroid<\/div><div class=\"expl-line\">Jan Riachwell<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">44. The following are true of pelvic imaging<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The uterine body has four district zones on T2-W MRI<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The endometrium and myometrium both enhanced with Gadolinium<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> CT is more accurate than plain film radiographic pelvimetry<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A post menopausal ovary should not exceed 9mls in volume<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Normal ovaries do not enhance with Gadolinium<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The nornmal uterine body has three distinct zones of T2-W MRI: high signal endometrium, low signal transitional zone due to compressed myometrium, and intermediate signal myometrium.<\/div><div class=\"expl-line\">The post menopausal ovary should not exceed 6 mls in volume. Ovaries enhance with Gadolinium.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">45. The following are true of percutaneous nephrostomy insertion<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Insertion into the upper pole calyx is preferable<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Direct pelvic puncture should be avoided<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Prophylactic antibiotics are routinely given<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Arterio-venous malformation occur in 0.5%<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A 5F catheter will pass through a 5F dilator<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The lower pole calyx is preferably punctured unless the patient is likely to require ureteric stenting in which case a middle pole calyx is preferred.<\/div><div class=\"expl-line\">A 5F catheter and a SF dilator have the sanje extenal diameter.<\/div><div class=\"expl-line\">A 5F catheter will pass through a 5F sheath however.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">46. The following are true of retrograde pyelogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A 4 French uterine catheter is passed under general anaethetic in theatre<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Urografin 300 mgs/ml is appropriate contrast media<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 10 mls of contrast media is required to affectively opacify the pelvicalyceal system<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Chemical pyelitis is a recognized complication<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Extravasation is usually a significant complication.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Urografin $150~mgs/ml$ is appropriate.<\/div><div class=\"expl-line\">A non-dilated pelvicalyceal system only requires 3-5 mls to opacify. Extravasation interferes with the image only.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">47. The zygomatic arches are clearly seen in<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A lateral skull<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A submento-vertical projection<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A occipito-mental projection with 30 degrees of caudal angulation<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A Fronto—occipital projection with 30 degrees of caudal angulation (Towne’s view)<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> An occipito-Frontal projection with 20 degrees of caudal angulation<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Ref: Bell and Finlay.<\/div><div class=\"expl-line\">Basic Radiographic Positioning and Anatomy. 1st Edition..<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">48. The following are diagnostic criteria For hypertrophied column of Bertin<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Lies at the junction of the lower and middle thirds of the kidney<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Contains no pyramids<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Measures 3.5 cm in maximum diameter<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Indents the renal sinus<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Is bordered by a junctional parenchymal line<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A hypertrophied column of Bertin lies between the upper and middle thirds of the kidney.<\/div><div class=\"expl-line\">The largest maximum diameter of a column of Bertin should be less than 3 cm.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">49. Regarding Gallium citrate scans<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Gallium is taken up by epiphyseal plates in children<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Gallium binds to iron binding sites of various proteins<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Breast feeding should be stopped for two days.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Gallium is taken up by thymus<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Gallium is taken up by the testis<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Breast feeding should be stopped for two weeks.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">50. Oral biliary contrast media<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Binds to albumin<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Is excreted and altered into bile by hepatocytes<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> is absorbed from the gut by an active process<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> ls made of iodinated benzene rings<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Induce mild gastrointestinal side effects in 50% of patients<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Oral biliary contrast media is conjugated by the liver.<\/div><div class=\"expl-line\">It is lipophilic and therefore diffuses pacifley across gastric mucosa.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">51. Regarding C.T of the abdomen<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The normal density of the liver is 60 +/- 5 HU<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The spleen commonly enhances heterogeneosly<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Hepatic parenchyma enhances by around 40 HU during arterial portography<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Peak hepatic enhancement is at 50-70 seconds after contrast injection into a peripheral vein<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Peak hepatic enhancement starts 40 seconds after injection into the superior mesenteric artery<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The liver enhances by 150-190 HU during arterial portography.<\/div><div class=\"expl-line\">Enhancement following intravenous contrast is around 40 HU.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">52. Regarding MR cholangiopancreatography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Cannot demonstrate ductal anatomy proximal to an occlusion<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Use heavily T2W sequences<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Can be used to assess metallic biliary stent patency<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Is useful in patients with a roux-on-Y procedure<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Spacial resolution is less than at ERCP<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Metallic artefact makes assessment of patency impossible.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">53. Buscopan is contraindicated in<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Diabetes Mellitus<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Angina Pectoris<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Glaucoma<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Hypertension<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Renal failure<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Techniques in Diannostic Imagine. 3rd E<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">54. Small bowel enema<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Pass tube through nasopharynx with head flexed<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Pass tube into oesophagus with head flexed<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Keep patient prone<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Keep guidewire proximal to pyloric sphinctre<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Pass the catheter beyond duodeno-jejunal flexure on the right of midline<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">It should be easier to pass an NG tube with the head extended.<\/div><div class=\"expl-line\">Ask patient to swallow it with a mouthful of water and hence the throat is not anaesthetised.<\/div><div class=\"expl-line\">The patient should be supine. It is much safer to keep the guidewire proximal to the sphinctre as it is less likely to cause perforation of bowel.<\/div><div class=\"expl-line\">The DJ flexure lies to the left of midline.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">55. SMA angiography technique<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A total volume of 20 mls of contrast is injected<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Infusion rate = 8 mls/s<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A sidewinder catheter may be used<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A hand injection of contrast is appropriate<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Buscopan 10 mg is administered<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">30-45 mls of contrst media is requied for an SMA angiongram.<\/div><div class=\"expl-line\">Femoro-visceral catheters such as a Sidewinder, Cobra or femoro-renal catheter can be used. Injcetion is with a pump.<\/div><div class=\"expl-line\">Buscopan is used to stop the bowel movement and therefore stops formation of subtraction artefact.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">56. Standard diagnostic vascular catheters<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Are usually 4-5F in size<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Are 60-100U cms long<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Super selective catheters have no side holes<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Selective catheters have side holes<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 7F catheters need 0.035&quot; guidewires<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">7F catheters need a $0.038&quot;&quot;$ guidewire.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">57. In Coronary Angiography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The catheters are continuously flushed with saline<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> There is continuous pressure monitoring<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Always check pressure before an injection<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Always check pressure during an injection<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Always check pressure after an injection<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">It is not possible to measure the pressure during injection because the pressure monitoring is actually done through the coronary catheter.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">58. Regarding radionuclide bone scans<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The gamma camera must be able to image the whole body<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Must have a high resolution collimator<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Tomographic capability essential<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Patient must be in position for imaging when injection is given<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Three-phase study is routine<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A low energy general purpose collimator can be used. For three-phase bone scan imaging the injection must be performed on the table. A three phase study is only performed if infection or primary bone tumour is suspected.<\/div><\/div>","due":42},{"section":"Exam 3 b","front":"<div class=\"stem\">60. Patient preparation for bronchography should include<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Chest physiotherapy<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Atropine 6 mg IV<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Buscopan 10 mg IV<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Diazemul l0 mg IV<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Morphine 10 mg<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false
