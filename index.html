l upper limit of pituitary gland height is 9mm<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Superiorly the pituitary gland is crossed by branches of the anterior cerebral arteries<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. TRUE D. TRUE E. TRUE<\/div><\/div>","due":35},{"section":"Exam 6 a","front":"<div class=\"stem\">36. Regarding the pons<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The pons has fibres which become the middle cerebellar peduncles<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The trigeminal nerve arises at its lower border<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The posterior surface forms the upper part of the floor of the Fourth ventricle<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The sixth, seventh and eighth cranial nerves emerge from lateral to medial<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The nuclei of its cranial nerve lie in its dorsal or tegmental part<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">The trigeminal nerve arises at the mid pons level<\/div><div class=\"expl-line\">The sixth, seventh and eighth cranial nerves lie medial to lateral<\/div><\/div>","due":35},{"section":"Exam 6 a","front":"<div class=\"stem\">37. Branches of the external carotid artery are<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Inferior thyroid artery<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Lingular artery<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Occipital artery<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Superior auricular artery<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Maxillary artery<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">It is not inferior hut the superior thyroid artery which is a branch of the external carotid artery<\/div><div class=\"expl-line\">Posterior auricular artery is a branch of external carotid artery<\/div><\/div>","due":35},{"section":"Exam 6 a","front":"<div class=\"stem\">38. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The hard palate is formed by the palatine process. of the maxilla and part of sphenoid bone<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The anterior arch of fauces in the oral cavity contains the palatopharyngeus muscle<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The intrinsic muscles of tongue include the genioglossus<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The mucus membrane of the anterior two thirds of the tongue is supplied by lingual nerve<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Taste buds are also located on the soft palate<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">The hard palate is formed by palatine process of maxillae and horizontal plate of palatine bones Anterior arch of the fauces<\/div><div class=\"expl-line\">contains the palatoglossus<\/div><div class=\"expl-line\">Genioglossus is an extrinsic muscle of the tongue, the others being the hyoglossus, styloglossus and palatoglossus<\/div><\/div>","due":35},{"section":"Exam 6 a","front":"<div class=\"stem\">39. Branches of the first part of subclavian artery are<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Vertebral artery<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Internal mammary artery<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Ascending pharyngeal artery<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The costocervical artery on the right<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Dorsal scapular artery<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. FALSE D. FALSE E. FALSE<\/div><div class=\"expl-line\">Ascending pharyngeal artery is a branch of external carotid artery<\/div><div class=\"expl-line\">The costo-cervical artery on the right arises from the second part of the subclavian artery, however on the left it arises from<\/div><div class=\"expl-line\">the first part<\/div><div class=\"expl-line\">Dorsal scapular artery arises from the third part of the subclavian artery<\/div><\/div>","due":35},{"section":"Exam 6 a","front":"<div class=\"stem\">40. The following are true regarding the right ventricle<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It has trabeculae carnae as ridges on its walls<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The anterior cusp of the tricuspid valve is the smallest<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The moderator band links the interventricular septum to the wall of the right ventricle<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> It has a funnel shaped infundibulum superiorly leading to the pulmonary trunk<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The pulmonary orifice lies at a lower level than the aortic orifice<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">The posterior cusp of the tricuspid valve is the smallest<\/div><div class=\"expl-line\">The pulmonary orifice lies at a higher level than the aortic<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">47. The Following doses are appropriate<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 10 ml of 2% Lignocaine subcutaneously for local anesthesia<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 20 mg of intravenous Buscopan for bowel relaxation<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 4 mg of intravenous chlorpheniramine for urticaria<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 0.5 – 1 ml of intravenous adrenalin 1/ 1000 for anaphylaxis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 0.5 ml of subcutaneous adrenalin 1/1000 for angio oedema<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">10 mls of 2% Lignocaine is the maximum adult dose.<\/div><div class=\"expl-line\">Up to 20 mg of intravenous chlorpheniramine can be given.<\/div><div class=\"expl-line\">0.1 - 5 ml of 1/10,000 is given intravenously for anaphylaxis.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">48. Regarding percutaneous transhepatic external biliary drainage<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Cholangitis is a contraindication<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The right hepatic ductal system is best cannulated from the anterior subcostal approach<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Catheter displacement occurs in 13%<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Dehydration and renal failure are major complications<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Effective palliation of jaundice occurs with decompression of 30% of the liver<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. TRUE E. TRUE<\/div><div class=\"expl-line\">A PTC may be life-saving in a patient with cholangitis.<\/div><div class=\"expl-line\">The left hepatic ductal system is best cannulated from the anterior subcostal approach.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">49. Regarding contrast swallow<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Barium extravasation during a swallow is less serious than an enema<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Gastrograffin is non-ionic<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Gastromiro is tasteless<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Gastromiro contains sugar<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Gastromiro is non-ionic<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Barium extravasation during an enema is more serious due to the associated faecal contamination.<\/div><div class=\"expl-line\">Gastrograffin contains Sodium/Meglumine diatrozoate.<\/div><div class=\"expl-line\">Gastromiro is orange flavoured, sugar free and water soluble.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">50. Metaclopramide<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Adult dose is 5 mg IV<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Decrease gastric peristalsis but enhances transit time for small bowel meal<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Side effects are common in children<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Contraindicated in renal failure<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Supratentorial side effect occur if the dose exceeds 0.5 mg/kg<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">Adult dose - 20 mg oral or IV<\/div><div class=\"expl-line\">Metaclopramide increases both gastric and small bowel motility.<\/div><div class=\"expl-line\">Extrapyramidal side effects may be seen if the dose exceeds 0.5 mg / kg.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">51. Stomach Radionuclide studies<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 113m Indium chelates are used<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> DTPA as an agent<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Can be used to investigate ulceration<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Can be used with liquid meals<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Gastric emptying is best studied using solid meals<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">99mTc is the radioisotope of choice.<\/div><div class=\"expl-line\">DTPA can be used as it is not significantly absorbed.<\/div><div class=\"expl-line\">Studies are used for estimating rates of gastric emptying.<\/div><div class=\"expl-line\">Both liquis and solid meals are tested.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">52. Double contrast barium enemas<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Barium sulphate 110 – 200% w/v<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Barium layer is 0.2 mm thick<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Crazy paving effect is due to loss of plasticity<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Dimethyl polysiloxane is part of the particle<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Very fine dense opacites occur with powder preparation<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Barium sulohate for contrast enemas is 60-110% w/v.<\/div><div class=\"expl-line\">A layer 0.2mm thick is required to provide good coating and correct density.<\/div><div class=\"expl-line\">Plasticity remains as the suspension dries when colon absorbs water.<\/div><div class=\"expl-line\">Dimethyl polysiloxane is added as an antifoaming agent.<\/div><div class=\"expl-line\">Very fine dense opacities are usually moisture that has entered the powder.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">53. Ultrasound of the Pylorus in infants<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The use of 10 MHz transducer is routine<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A Linear transducer should be used<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A NG tube is necessary<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Stomach filled with warm water<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> IV buscopan very helpful<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">A 5 - 7.5 MHz linear or sector scanner is used.<\/div><div class=\"expl-line\">An NG tube is required to decompress stomach.<\/div><div class=\"expl-line\">The pylorus becomes displaced posteriorly if the stomach is filled with water.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">54. Angiographic units must have<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Digital vascular subtraction facility<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Puck changer<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> C-arm<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Stepping facility<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A pressure injector<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">A digital system is highly desirable and all new modern angiographic suites have one.<\/div><div class=\"expl-line\">Almost no modern angiographic suites have puck film facilities as standard.<\/div><div class=\"expl-line\">A C-arm is highly desirable - even the biplane units have one C-arm.<\/div><div class=\"expl-line\">Stepping facility can be useful for lower limb angiography but this does not even come as a standard on most angiographic<\/div><div class=\"expl-line\">suites nowadays.<\/div><div class=\"expl-line\">A pressure injector is critical.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">55. Volume of contrast for the Following angiographic investigations is appropriate<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Aorta and legs - 80 mls<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Coeliac angiography - 20 mls<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> SMA angiography - 25 mls<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Selective renal artery angiography — 20 mls<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Selective left main coronary artery - 8 mls<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Using a puck run 80 mls of contrast is required but using the stepping technique or bolus chasing less contrast is required.<\/div><div class=\"expl-line\">Coeliac angiography requires 30-45 mls of contrast, SMA angiography requires 35-50 mls, and elective left main cirinary<\/div><div class=\"expl-line\">artery studies require 10 mls.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">56. Routine MRI of the Achilles tendon includes the following sequences<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Coronal T1<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Coronal STIR<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Sagittal T2<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Sagittal STIR<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Axial T1<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. TRUE E. TRUE<\/div><div class=\"expl-line\">Coronal views unhelpful as the achilles tendon is orientated on the coronal plane.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">57. Regarding shoulder Arthrography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 2-4 mls of contrast are used in a double contrast study<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 8 – 12 mls of air is used in a double contrast study<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> An anterior approach is routine<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A Vertical puncture is appropriate<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Injection site is 5 cms lateral to coracoid process<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">The injection site is 2.5 cms lateral and inferior to coracoid process.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">58. Regarding Lung Biopsy<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Outpatient procedure<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Premedication is necessary<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 18 G aspiration needle<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 20 G core biopsy needles are used<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Maximum two passes<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">Usually 1-2 passes but further passes are allowable if the patient can tolerate it.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">59. The Following are true of Indium<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 113m Indium – 171 KeV<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 111m Indium - 245 KeV<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 111m Indium - 390 KeV<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 111m Indium - Gamma emitter<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 113m Indium - Gamma emitter<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">113mInindium emits at 390 KeV.<\/div><div class=\"expl-line\">111mIndium emits at 171 and 245 KeV.<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">60. The Following centering points are correct<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Tunnel view of knee - apex of patella<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Skyline view of patella - apex of the patella<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> AP cervical spine -midline 5cms above suprasternal notch<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Lateral cervical spine - angle of mandible<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Right anterior oblique of cervical spine - 2.5 cms below the angle of the mandible<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">The tunnel view is also known as the ‘modified&#x27; AP view<\/div><div class=\"expl-line\">Skyline view of the patella - behind apex of patella<\/div><div class=\"expl-line\">Lateral cervical spine - 2.5cms behind angle of the mandible<\/div><\/div>","due":35},{"section":"Exam 6 b","front":"<div class=\"stem\">45. When imaging the cervical spine<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Oblique views are taken with the head turned 60 degrees from the sagittal plane<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The centering point for a lateral cervical spine x-ray is 2.5 cm behind the angle of the mandible<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The neural foramina demonstrated on an anterior oblique projection are those on the side nearest the film<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The neural foramina demonstrated on a posterior oblique projection are those on the side nearest the film<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 15 degrees of caudal angulation is required for anterior oblique views<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">A cervical oblique x-ray is performed with 45 degrees of head turn.<\/div><div class=\"expl-line\">15 degrees cranial angulation is required for an A oblique whilst 15 degrees of caudal angulation is required for a P<\/div><div class=\"expl-line\">oblique of the cervical spine.<\/div><\/div>","due":36},{"section":"Exam 6 b","front":"<div class=\"stem\">41. When performing hysterosalpingogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The examination should only be performed in the 10 days preceding menstruation<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The Pouch of Douglas is often demonstrated<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Can safely be performed shortly after curettage<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Infection occurs in up to 2% of cases<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> It is normal for pain to persist up to 2 weeks<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">There is an increased risk of intravasation in the first 10 days after menstruation and shortly after curettage.<\/div><\/div>","due":37},{"section":"Exam 6 b","front":"<div class=\"stem\">42. Regarding ultrasound of the ovary<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Graafian Follicles grow 3 mms a day<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The maximum diameter of a normal graafian Follicle is 3.5 cms<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 20% of neonates have fluid in the endometrial cavity<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> During the proliferative phase the endometrium can be greater than l cm thick<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The endometrium is high signal on T2-W MRI<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict \"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">A DMSA renogram demonstrates functional cortical tissue, and therefore allows detection of scarring.<\/div><div class=\"expl-line\">It allows assessment of divided renal function as 30-40% remains bound to the proximal convoluted tubule.<\/div><div class=\"expl-line\">Imaging is performed at 1-6 hours.<\/div><\/div>","due":37},{"section":"Exam 6 b","front":"<div class=\"stem\">44. The Following are true regarding myelography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Maximum dose of 3 grams of iodine should be used<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> CT should be delayed by 24 hours<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Headache occurs in 10-20 of patients<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Extra thecal injection will outline the nerve roots well beyond the neural foramina<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The lumbar region is demonstrated best with the patient supine<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. TRUE E. FALSE<\/div><div class=\"expl-line\">The CT should be performed at 2-3 hours.<\/div><div class=\"expl-line\">Headache occurs in 30-40%. In the prone position the lumbar region is dependent.<\/div><\/div>","due":37},{"section":"Exam 6 b","front":"<div class=\"stem\">46. Normal measurements of endometrial thickness include<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Neonate - 4-6 mm<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Menstrual phase - 7-14 mm<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Proliferative phase - 7-14 mm<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Secretory phase - 4-6 mm<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Postmenopausal is less than 8 mm<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Normal endometrial thickness during menstruation is 1-3 mm.<\/div><div class=\"expl-line\">during the proliferative phase is 4-6 mm.<\/div><div class=\"expl-line\">and during the secretory phase is 7-14 mm.<\/div><\/div>","due":37},{"section":"Exam 7 a","front":"<div class=\"stem\">21. Regarding the globe of the eye<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Tenon&#x27;s capsule covers the sclera on its entire surface<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The six extrinsic muscles of the eye arise from a common tendinous ring called annulus of zinn<\/div><div cla ><div class=\"expl-line\">The SMA supplies the 2nd part of the duodenum to the mid transverse colon<\/div><div class=\"expl-line\">The SMA arises at L1<\/div><div class=\"expl-line\">The SMA lies to the left of the superior mesenteric vein<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">30. Regarding the segments of the liver<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The caudate lobe is segment IV<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Segment V is directly related to the diaphragm<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Segment III lies the left of the inferior vena cava<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Segment VII receives blood from the right portal vein<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The quadrate lobe corresponds to segment VI<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">The caudate lobe is segment I<\/div><div class=\"expl-line\">Segment V is the anterior/inferior segment and is thus not related to the diaphragm<\/div><div class=\"expl-line\">The quadrate lobe corresponds to segment IV<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">31. Regarding the kidneys<\/div><div class=\"option\"><spa al ligament<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The sacro-iliac joints on each side are true synovial joints<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The normal atlanto-axial distance in adults is up to 5mm<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> In axial CT of the facet joints the articular process anterior to the joints is that of the vertebra below<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E TRUE<\/div><div class=\"expl-line\">The facet joints are synovial joint<\/div><div class=\"expl-line\">The normal atlanto-axial distance is 3mm.<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">33. The Following are true regarding trachea<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The anterior relations in the cervical region are isthmus and superior thyroid vein<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Posteriorly in the cervical region is the oesophagus and recurrent laryngeal nerves<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> In the thoracic region the left brachiocephalic vein forms the left lateral relation<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The upper trachea is supplied by the inferior thyroid artery<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The normal subcarinal angle is slightly larger in children<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">It is the inferior thyroid vein which lies anterior to the trachea.<\/div><div class=\"expl-line\">The left brachiocephalic vein is an anterior relation at this site.<\/div><div class=\"expl-line\">The aorta gives off 9 pairs of intercostal arteries.<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">34. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Aorta passes through the diaphragm at level T10<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The hemiazygous vein on the left side passes behind the aorta<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The aorta gives off 6 pairs of intercostal arteries and a pair of subcostal arteries<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The descending aorta lies behind the left main bronchus and pulmonary artery<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The descending aorta at its highest point has the oesophagus to its right<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. FALSE D. TRUE E. TRUE<\/div><div class=\"expl-line\">The aorta passes through the diaphragm at level T12.<\/div><div class=\"expl-line\">The aorta gives off 9 pairs of intercostal arteries.<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">35. The Following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The temporo-mandibular-joint (TM) is a specialised secondary cartilaginous joint<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The TM joint is divided into anterior and posterior compartments<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The TM joint is most stable with mouth closed<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The TM joint contains a hyaline cartilaginous meniscus<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> In a TM joint the gliding movements occur in the upper compartment and hinge movements occur at the lower compartment<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\ ine\">The anterior median fissure begins at the lower edge of pons<\/div><div class=\"expl-line\">The olives are situated lateral to the pyramid<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">37. Regarding veins of the face and scalp<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The facial vein is formed at the lateral angle of the mouth<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The facial vein lies posterior to the facial artery<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The pterygoid venous plexus is drained via the maxillary vein to the retromandibular vein<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The retromandibular vein is formed by the union of facial and superficial temporal veins<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The anterior division of the retromandibular vein joins the posterior auricular vein to form the external jugular vein<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A FALSE B. TRUE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">Facial vein is formed at the medial angle of the eye by union of supraorbital and supratrochlear veins.<\/div><div class=\"expl-line\">The retromandibular vein is formed by union of superficial temporal vein and maxillary vein.<\/div><div class=\"expl-line\">The posterior division of retromandibular vein joins the posterior auricular vein to form the external jugular vein<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">38. The muscles of the soft palate are<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Tensor veli palatini<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Palatoglossus<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Levator veli palatini<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Hyoglossus<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Palatopharyngeus<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B TRUE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Hyoglossus is an extrinsic muscle of the tongue<\/div><\/div>","due":34},{"section":"Exam 7 a","front":"<div class=\"stem\">39. Regarding the infratemporal space<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It lies lateral to the paranasal pharyngeal space<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> It extends from base of skull to the hyoid bone<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> It contains the pterygoid muscles<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The foramen ovale and Foramen spinosum open into the space<\/div><div class=\"option\"><span c ><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. TRUE D. TRUE E. TRUE<\/div><\/div>","due":34},{"section":"Exam 7 b","front":"<div class=\"stem\">49. Barium Swallows<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 35 x 43 films are used routinely<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Initial radiographs are taken prone<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Initial position is AP<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A lateral view is essential<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Right posterior oblique views are taken in the prone position<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. FALSE D. FALSE E. FALSE<\/div><div class=\"expl-line\">If radiographic film is used it is usually 24 x 30 or 35 x 35 cms.<\/div><div class=\"expl-line\">The initial radiograph is taken erect in the RAO position to clear oesophagus from spine.<\/div><div class=\"expl-line\">Lateral views are only necessary in pediatric swallows.<\/div><div class=\"expl-line\">LPO view is taken in the prime position.<\/div><\/div>","due":34},{"section":"Exam 7 b","front":"<div class=\"stem\">60. Krypton ventilation scans<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Aerosol form is the best<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Only posterior views are possible<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Wash-in / wash-out studies are possible<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> fire cheap<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Patient breaths 81mK through a mouthpiece during image acquisition<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A FALSE B. FALSE C. FALSE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Pure 81mKr gas better than aerosol preparations.<\/div><div class=\"expl-line\">The same views are possible as a perfusion scan.<\/div><div class=\"expl-line\">Only xenon studies allow wash-in / wash-out studies.<\/div><div class=\"expl-line\">Krypton is expensive.<\/div><\/div>","due":34},{"section":"Exam 7 b","front":"<div class=\"stem\">41. The Following are true regarding hysterosalpingograms<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Intravasation of water soluble contrast media is harmless<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Hypogastric colic is due to uterine distention<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Delayed pain is due to peri div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. TRUE E. FALSE<\/div><div class=\"expl-line\">Nowadays TLA’s can be done using local anaesthesia, the complication rate is 2.9% compared to 3.3% for the trans-<\/div><div class=\"expl-line\">axillary approach.<\/div><div class=\"expl-line\">With new wires and catheters selective catheterization of most vessels is possible.<\/div><div class=\"expl-line\">The transfemoral complication rate is 1.7% vs 2.9% for TLA and hence transfemoral catheter angiography and<\/div><div class=\"expl-line\">intravenous studies (as well as Doppler) are now the intial routine investigation. The patient lies prone.<\/div><\/div>","due":35},{"section":"Exam 8 b","front":"<div class=\"stem\">55. Ankle Arthrography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 6-8 mls contrast is required<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 8- l2 mls of air is required<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The foot should be plantar-flexed<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> An anterior approach is routine<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The needle is inserted 1 cm medial and superior to the lateral malleolus<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. T lobulation the cortical indention overlies the pyramids<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A splenic hump is a normal variant of the left kidney<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> There is no distortion of the cortical outline overlying a septa of Bertin<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> There is dilatation of the renal pelvis in 50% of women at 30 weeks gestation<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The renal pelvis is more commonly distended in pregnancy on the right<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">Cortical indentations due to fetal lobulation overlies the interpyramidal interface.<\/div><div class=\"expl-line\">Two-thirds of cases of women have renal pelvis dilatation at 30 weeks.<\/div><\/div>","due":36},{"section":"Exam 8 b","front":"<div class=\"stem\">42. Regarding the intravenous pyelogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The right kidney is best demonstrated in the right anterior oblique position<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Calcification is fully demonstrated on a high kVp film<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The bladder should be empied prior to the study to avoid obscuring the distal ureters<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The left ureter is best demonstrated by the left posterior oblique view<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The prone position is useful in demonstrating the lower ureter<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. FALSE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">A low kVp is chosen for an IVP to demonstrate calcification.<\/div><div class=\"expl-line\">The left anterior oblique is the best view for demonstrating the left ureter.<\/div><\/div>","due":36},{"section":"Exam 8 b","front":"<div class=\"stem\">43. An indirect micturating cystogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Will over diagnose reflux during the bladder filling phase<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Requires the patient to be toilet trained<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Allows the calculation of post micturition bladder volume<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Does not allow the calculation of urine flow rate<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Produces lower background ureteric counts with DTPA than MAG-3 prior to micturition<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">Reflux will be missed due to the presence of residual radionucleide in the ureter.<\/div><div class=\"expl-line\">If the study is negative a direct micturating cystogram is required.<\/div><div class=\"expl-line\">The urine flow rate can be calculated from the activity curve if the micturating volume is known. MAG-3 is cleared more<\/div><div class=\"expl-line\">quickly from the ureters than DTPA.<\/div><\/div>","due":36},{"section":"Exam 8 b","front":"<div class=\"stem\">49. Paediatric Swallow<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> LAO view is mandatory<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> RAO view is routine<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> AP and lateral views are mandatory<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Barium swallow is mandatory to diagnosis oesophageal atresia<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Barium swallow is mandatory to demonstrate trachea-oesophageal fistula<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. TRUE C. TRUE D. FALSE E. FALSE<\/div><div class=\"expl-line\">A LAO view is not mandatory.<\/div><div class=\"expl-line\">AP and lateral views are mandatory to look for a vascular ring.<\/div><div class=\"expl-line\">Oesophageal atresia can be diagnosed by passing a soft NCI tube and taking a CXR.<\/div><div class=\"expl-line\">Gastromiro and a NG tube should be used to demonstrate a tracheoesophageal fistula.<\/div><\/div>","due":36},{"section":"Exam 8 b","front":"<div class=\"stem\">50. Picolax<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Take first sachet after breakfast the day before<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Take second sachet at 4 pm<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> No solid food from breakfast<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Take one litre of water every four hours<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> No fluids on day of examination<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A FALSE B. TRUE C. FALSE D. FALSE E. FALSE<\/div><div class=\"expl-line\">The first satchet is taken before breakfast. Light lunch day before is acceptable.<\/div><div class=\"expl-line\">Drink to satisfy thirst. Plenty of fluids on the day of the examination. In particular one should be careful with possible<\/div><div class=\"expl-line\">dehydration and electrolyte imbalance in elderly patients.<\/div><\/div>","due":36},{"section":"Exam 8 b","front":"<div class=\"stem\">56. Ultrasound of the paediatric hip<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A 7.5 MHz linear transducer is used routinely<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Can identify anatomy better than x-ray until 6 months<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Can visualise the triradiate cartilage<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Plain films are preferable after 6 months<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The distance between the femoral neck and the capsule is less 3 mm<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. TRUE B. TRUE C. TRUE D. TRUE E. TRUE<\/div><div class=\"expl-line\">Ossification precludes imaging after 6-9 months<\/div><\/div>","due":36},{"section":"Exam 8 b","front":"<div class=\"stem\">57. NIH Catheters<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Has 1 end hole and 6 side holes<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Will receive a 0.035 guide wire<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Requires a vascular sheath<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Necessitates antecubital approach<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Can be used to examine the left heart in children<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A. FALSE B. FALSE C. TRUE D. FALSE E. TRUE<\/div><div class=\"expl-line\">An NIH catheter has no end hole and therefore a guide-wire cannot be used.<\/div><div class=\"expl-line\">It is therefore essential that a vascular sheath is used.<\/div><div class=\"expl-line\">A femoral approach is preferable. Usually possible to manipulate a catheter via a patent foramen ovale into the<\/div><div class=\"expl-line\">left heart in children.<\/div><\/div>","due":36}];
const section=document.getElementById('section'),search=document.getElementById('search'),front=document.getElementById('front'),back=document.getElementById('back'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let shown=[],i=0;
const sections=[...new Set(cards.map(x=>x.section))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));section.innerHTML='<option value="">كل المجموعات</option>'+sections.map(x=>`<option>${x}</option>`).join('');
function strip(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent.toLowerCase()}
function filter(){const q=search.value.trim().toLowerCase();shown=cards.filter(c=>(!section.value||c.section===section.value)&&(!q||strip(c.front+' '+c.back).includes(q)));i=0;render()}
function render(){if(!shown.length){front.innerHTML='<div class="empty">لا توجد بطاقات مطابقة</div>';back.innerHTML='';counter.textContent='0 / 0';bar.style.width='0%';return}const c=shown[i];front.innerHTML=c.front;back.innerHTML=c.back;back.classList.remove('show');document.getElementById('reveal').textContent='إظهار الإجابة';counter.textContent=`${i+1} / ${shown.length} — ${c.section}`;bar.style.width=`${(i+1)/shown.length*100}%`}
section.onchange=filter;search.oninput=filter;document.getElementById('next').onclick=()=>{if(shown.length){i=(i+1)%shown.length;render()}};document.getElementById('prev').onclick=()=>{if(shown.length){i=(i-1+shown.length)%shown.length;render()}};document.getElementById('reveal').onclick=e=>{back.classList.toggle('show');e.target.textContent=back.classList.contains('show')?'إخفاء الإجابة':'إظهار الإجابة'};document.onkeydown=e=>{if(e.key==='ArrowLeft')document.getElementById('next').click();if(e.key==='ArrowRight')document.getElementById('prev').click();if(e.key===' ') {e.preventDefault();document.getElementById('reveal').click()}};filter();
</script></body></html>
