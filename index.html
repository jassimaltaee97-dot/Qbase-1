d on the sides of the superior part of the third ventricle<\/div><div class=\"expl-line\">The pulvinar project posteriorly and laterally<\/div><div class=\"expl-line\">Refe<\/div><\/div>","due":42},{"section":"Exam 4 a","front":"<div class=\"stem\">38. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The roof of the orbital cavity is formed by the frontal bone and lesser wing of sphenoid<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The greater wing of sphenoid forms part of the lateral wall of orbital cavity<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The maxillary nerve passes through the inferior orbital fissure.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The superior orbital fissure has two compartments of which the medial part is wider<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The inferior ophthalmic vein passes through the inferior orbital fissure<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The inferior ophthalmic vein passes through the superior orbital fissure<\/div><div class=\"expl-line\">Refr:<\/div><\/div>","due":42},{"section":"Exam 4 a","front":"<div class=\"stem\">26. Regarding the bones of the arm<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The synovial membrane of the elbow joint is attached to the articular margin of the radial head.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The coronoid process is a projection at the distal aspect of the trochlear notch.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The medial epicondyle of the humerus gives attachment to the common extensor origin.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The lesser tuberosity of the humerus is posterior to the greater tuberosity.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The inferior angle of the scapula may mimic a “hot spot&quot; on a bone scan.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The common flexor origin is attached to the medial epicondyle of the humerus<\/div><div class=\"expl-line\">The lesser tuberosity is anterior to the greater tuberosity<\/div><div class=\"expl-line\">Dafet<\/div><\/div>","due":43},{"section":"Exam 4 a","front":"<div class=\"stem\">33. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The right hemidiaphragm is higher by 1.5-2.5cm in 60% of cases<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The sensory supply of the peripheral part of diaphragm passes through the lower 5 intercostal nerves.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The highest point of the right dome is at the 6th intercostal space anteriorly.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The range of movement in deep inspiration/expiration is a maximum of 2cm.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> In a lateral decubitus view the dome on the dependent side is higher.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The right hemidiaphragm is higher in 90% of cases.<\/div><div class=\"expl-line\">The range of movement in deep inspiration/expiration is about 4cm.<\/div><div class=\"expl-line\">Refs:<\/div><\/div>","due":43},{"section":"Exam 4 b","front":"<div class=\"stem\">47. Regarding congenital abnormalities of the uterus<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The uterus develops from the Woolfian ducts<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A Uterus Didelphys has two vaginas<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A bicollis uterus has two uterine horns<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> There is an increased risk of ipsilateral renal abnormalities<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Have a higher incidence in patients who have had inutero exposure to diethyl-stilbestrol<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The uterus develops from the Mullerian ducts.<\/div><div class=\"expl-line\">A bicollis uterus hastwo cervices. A bicornuate uterus has two horns.<\/div><div class=\"expl-line\">Allieon Diagnostic Radiology. 3rd Edition. Churchill Livingstone.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">48. The following are true of a T-tube cholangiogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Usually performed 21 days post-op<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Rapid injection into an obstructed system can induce septicemia<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Intravenous glucogon reduces the incidence of pseudocalculus phenomenom<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> ionic contrast media are contraindicated<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Contrast media with an osmolality of at least 240 mg of l per ml is required<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">T-Tube cholangiograms are usually performed 10 days post op.<\/div><div class=\"expl-line\">An osmolality of around 150 mg of 1 per ml is more appropriate in order not to obscure any calculus present.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">49. The following are true of Technetium labelled iminodiacetic acid analogue in liver scans<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The normal gallbladder is visualised at 30 minutes in 90%<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Phenobarbitone treatment reduces hepatic excretion of isotope<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The more hydrophilic the analogue, the greater the biliary contrast<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Morphine salts improve gallbladder visualisation<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Are indicated in suspected bile leaks<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Oral phenobarbitone is given to infants with suspected biliary atresia 3-5 days prior to the scan to enhance hepatic excretion.<\/div><div class=\"expl-line\">Hydrophilic analogues have greater renal excretion, and consequently reduced hepatic uptake.<\/div><div class=\"expl-line\">HIDA is the most hydrophilic analogue, and hepatic uptake is dependent on low serum bilirubin levels.<\/div><div class=\"expl-line\">Edition WA Saunders Co<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">50. When performing endoscopic retrograde cholangiography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Hyperamylasaemia is seen in 30% of cases<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Acute pancreatitis is seen in.20%<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The Trendelenburg position opacifies the distal common bile duct<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Is contraindicated in active cholangitis<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Glyceryl trinitrate spray can cause relaxation of the sphinctre of Oddi<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Hyperamylasaemia occurs in 70%. Acute pancreatitis occurs in 0.7-7.4%.<\/div><div class=\"expl-line\">The trendelenburg position is a head-down position. Active cholangiris is not a contraindication but appropriate antibiotic cover is essential.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">51. Glucagon<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Derived from islets of Langerhans<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Produces gastric / duodenal hypotonia<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Patients can get hypersensitivity reactions<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Onset of action two minutes<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Nausea and vomiting can occur<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Glucagon acts within one minute.<\/div><div class=\"expl-line\">Ref: Chapman &amp; Nakielny. A Guide to Radiological Procedures. 3rd Edition. WB Saunders Co Ltd.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">52. Small bowel enema - technique<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Use 50% w/v barium suspension<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A fast infusion should be employed<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Is slower than a small bowel meal<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Usually needs 400 mls<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Need gaps between injections / infusion<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">You need 15-20% w/v barium for a small bowel enema.<\/div><div class=\"expl-line\">A fast infusion can distend and paralyse jejunum. These studies are usually slower than a SB meal due to over distention leading to an ileus.<\/div><div class=\"expl-line\">Up to 1200 mis of barium suspension is required. Maintain a steady flow, gaps can delay in progress of barium.<\/div><div class=\"expl-line\">Date Whitehouse Worthington. Techniques in Diagnostic Imaging. 3rd Edition. Blackwell<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">53. CT Stomach<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Water is better than oral gastrograffin<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A distended stomach is difficult to evaluate<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> IV contrast is necessary<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Oral gas tablets advised<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> NG tube should be inserted<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The stomach should be distended otherwise the-gastric wall in particular posteromedially can look very thickened.<\/div><div class=\"expl-line\">The stomach wall enhances as do the vessels. Gas tablets are not necessary routinely.<\/div><div class=\"expl-line\">NG tubes should be avoided as they can cause artefacts.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">54. IMA Angiography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> IMA angiography should be performed before SMA and coeliac angiogram<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A hand injection of contrast is appropriate<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 10 mls of 300 mg per ml non-ionic contrast media is injected<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> RPO views are performed to examine the sigmoid area<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Abdominal compression is used<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The IMA should be studied before the SMA in order that the bladder does not fill and obscure it.<\/div><div class=\"expl-line\">350 or 370 mg per ml contrast media is too viscous.<\/div><div class=\"expl-line\">IMA angiography is performed LPO 30 degrees to look at sigmoid views.<\/div><div class=\"expl-line\">Ref Chanman Nabielus A Guide to Radiolocical Procedures. 3rd Edition. WB Saunders Co Ltd.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">55. The following statements are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Sidewinder catheter is used for renal angiography<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Sidewinder catheters are used for Coeliac Axis angiography<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Headhunter catheters are used for cerebral angiography<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Mani catheters are used for bronchial angiography<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Cobra catheters are used for aortography<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Mani catheters are multipurpose.<\/div><div class=\"expl-line\">Cobra catheters are a standard visceral catheter. Aortography is usually performed using either a straight or pigtail catheter.<\/div><div class=\"expl-line\">Dal. Chamma Nahi Cuida sa Dadiatomical Pontedures 3rd Edition. WB Saunders Co Ltd.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">56. Regarding embolisation techniques<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Before hepatic artery embolisation always check that the portal vein is patent<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Hepatic artery embolisation should always be done after an SMA angiogram<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Always use a sheath<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Always use a co-axial technique<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Embolise the proximal vessels first<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The portal vein must be patent if the hepatic artery or one of its branches is to be embolised, oils- erwise it could lead to vascular compromise.<\/div><div class=\"expl-line\">An SMA angiogram should be performed to confirm that there are no anatomical variants and do an indirect portogram to check patency<\/div><div class=\"expl-line\">The co-axial rechnique is often performed but only for super selected small vessels.<\/div><div class=\"expl-line\">Always embolise the smallest distal vessels first otherwise one loses the access to the smaller vessels later.<\/div><div class=\"expl-line\">4 Cuide in Radiological Procedures. 3rd Edition. WB Saunders Co<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">57. Routine MRI sequences of the knee include<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Coronal volume gradient echo<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Coronal T1<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Coronal STIR<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Axial-gradient echo<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Coronal T2<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Sagittal volume images are aquired angled to demonstrate the ACL.<\/div><div class=\"expl-line\">Axial GE sequences are only for used patello-femoral disease. T2W sequences have now been replaced predominantly by faster GE and STIR sequences.<\/div><div class=\"expl-line\">unt Oshanandice and Sports Medicine. Steller. Lippincott Raven.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">58. Standard images for-radionuclide bone scans<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Number of views depends on field of view of the gamma camera<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Whole body images have lower resolution<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Anterior oblique views-are taken to separate sternum and ribs<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Additional views with arms up is helpful<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Magnified views with pin-hole collimator is helpful<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Anterior oblique views are used to separate the sternum from the spine.<\/div><div class=\"expl-line\">With the arms up the scapula elevates and it can therefore look at the posterior ribs.<\/div><div class=\"expl-line\">Derradurar 3rd Edition. WB Saunders Co<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">59. The-Following are appropriate centering points<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> AP Shoulder - head of humerus<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Axial shoulder — head of humerus<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> AP Elbow - 2.5 cms above elbow crease<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> AP Knee - 2.5 cms above inferior border of patella<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Lateral knee - medial epicondyle<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The centering point for An AP view of the shoulder is the coracoid process, for an Al view of the knee is below not above the inferior border of the patella, and for a lateral view of the knee is 2.5 cm below and behind the inferior border of the patella.<\/div><div class=\"expl-line\">Edition. Bailliere Tindall.<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">60. Regarding bronchography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 2-3 mls of contrast are used per segment<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A-maximum of 25 ml can be introduced per lung<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A preliminary PA chest x-ray only is performed<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The bronchoscopic method is preferable<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Views are taken of each hemithorax<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">25 mls in total should be used per patient.<\/div><div class=\"expl-line\">A preliminary PA and lateral chest x-ray should be per- formed to get exposure and centering correctly set and also to exclude contraindications.<\/div><div class=\"expl-line\">Spot views are now taken. Previously with Dionosil the coating was much better and each lung was imaged.<\/div><div class=\"expl-line\">Cuide to Radiological Procedures. Jed Edition. WB Saunders Co<\/div><\/div>","due":37},{"section":"Exam 4 b","front":"<div class=\"stem\">41. Regarding venography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The internal iliac vein can be demonstrated by injection into the Foot<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The valsalva manoeuvre can assist in demonstrating valves<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The anterior tibial veins often only fill retrogradely<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Minor contrast-reactions are more common with arterial then venous injection<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> injection into the cephalic vein is preferred when performing an upper limb venogram<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The internal iliac vein does not drain the lower limb. More contrast reactions are associated with intravenous than intra-arterial injections.<\/div><div class=\"expl-line\">The cephalic vein bypasses the axillary vein, and can give the impression of stenosis as it passes through the clavipectoral fascia.<\/div><\/div>","due":38},{"section":"Exam 4 b","front":"<div class=\"stem\">43. The following are true of a white cell scan<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Leukocytes are labelled in vivo<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 111 In has a T1/2 of l67 hours<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 99m Tc - HMPAO preferentially labels granulocytes<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Labelling with 111 ln gives greater spatial resolution than with 99mTc-HMPAO<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Donor leukocytes are often used in neutropenia<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Labelling is in vitro. T½ of  In is 67 hours.<\/div><div class=\"expl-line\">Te-HMPAO gives greater spatial resolution than $m/n$<\/div><div class=\"expl-line\">Ref Chanman  Marialun &amp; Cuida  Dadiatanical Derenduem Red Edition WB Saunders Co I id<\/div><\/div>","due":38},{"section":"Exam 4 b","front":"<div class=\"stem\">44. When performing an intravenous pyelogram on a child<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Compression is routinely used in infants<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Delay in the nephrogram phase by 1-3 hours is normal in the neonate<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A gaseous drink is given to create a window for the kidneys<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A multilayer cassette increases the dose of tomography<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Kidneys can be usefully demonstrated behind bowel gas on a lateral film<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Compression is never used in infants.<\/div><div class=\"expl-line\">Multilayer casettes are no longer performed, but were used to reduce dose.<\/div><div class=\"expl-line\">Dadialanical Dracedures. 3rd Edition. WB Saunders Co<\/div><\/div>","due":38},{"section":"Exam 4 b","front":"<div class=\"stem\">45. The Following are true<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Normal kidneys are approximately 2 cm longer on an intravenous pyelogram than on ultrasound<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The right kidney is commonly longer than the left kidney<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The kidneys move up to 6 cms with changes in position and respiration<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 5% of people have a bifid renal pelvis<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Upper tract dilatation can be normal in the presence of a distended bladder<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The left kidney is more commonly longer than the right.<\/div><div class=\"expl-line\">10% of people have bifid kidneys.<\/div><div class=\"expl-line\">Ref: Grainger &amp; Allison. Diagnostic Radiology. 3rd Edition. Churchill Livingstone.<\/div><\/div>","due":38},{"section":"Exam 4 b","front":"<div class=\"stem\">46. When performing a lateral skull x-ray<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A horizontal beam is mandatory following trauma<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Grids are not routinely used<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The roof of the orbits is projected above the floor of the anterior cranial fossa<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The habenular commissure lies posterior to the pineal gland<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The centering point is midway between the glabella and the occipital protuberance<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">A grid should be used wherever possible.<\/div><div class=\"expl-line\">The orbital roofs are seen projected through or just below the anterior cranial fossa on a lateral SXR The habenular lies anterior to the pineal gland.<\/div><div class=\"expl-line\">Dadinarankie Daritianine and Anatomy. 1st Edition. Bailliere Tindall.<\/div><\/div>","due":38},{"section":"Exam 4 b","front":"<div class=\"stem\">42. Regarding doppler ultrasound of the deep veins<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Duplex scanning implies the combination of B mode and colour doppler<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Augmentation is the most reliable sign of vein patency<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Acute thrombus is echogenic<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Loss of respiratory variation indicates a distal occlusion<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Slow flowing blood can be mistaken for thrombus on B mode scanning<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">B mode and pulse doppler make up Duplex scanning.<\/div><div class=\"expl-line\">Compressibility is a more reliable sign than augmentation. Acute thrombus is hypocchoic.<\/div><div class=\"expl-line\">Loss of respiratory variation would indicate a prox imal obstruction.<\/div><\/div>","due":39},{"section":"Exam 5 a","front":"<div class=\"stem\">23. In the popliteal Fossa<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Plantaris tendon lies deep to the medial head of gastrocneumius<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Popliteus tendon is attached to the medial meniscus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> fabella is seen in 5% of adults<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The popliteal vein is superficial to the tibial nerve<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The common peroneal nerve is lateral to the tibial nerve<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Popliteus tendon is attached to the posterior part of the lateral meniscus s=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Usually double contrast but single contrast is performed for specific indications c.g Baker&#x27;s cyst 40-80 mis of air are instilled.<\/div><div class=\"expl-line\">The puncture site is under the mid-point of patella for medial or lateral approach Effusions can be aspirated before injection of contrast.<\/div><\/div>","due":35},{"section":"Exam 5 b","front":"<div class=\"stem\">57. Complications of bronchography include<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Lignocaine toxicity<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Bronchospasm<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Perforation of oesophagus<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Increase in FEV1<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Delayed fall in Sa O2<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Mucous membrame absorbs lignocaine spray very rapidly and toxicity can therefore be a problem.<\/div><div class=\"expl-line\">FEV1 falls. If a fall in Sa O2 is going to happen it occurs during the procedure.<\/div><\/div>","due":35},{"section":"Exam 5 b","front":"<div class=\"stem\">58. The Following radioisotopes are used in VQ studies<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 99mTc - DTPA Aerosol<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 133 Xe - Technegas<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 81mKr Krypton gas<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 127 Xe gas<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 99mTC - DMSA Technegas<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Technegas is labelled with 99mTc.<\/div><\/div>","due":35},{"section":"Exam 5 b","front":"<div class=\"stem\">59. HRCT of the lungs<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Is improved by spiral scanning<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Uses an algorithm<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Non-ionic IV contrast enhancement is advised<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 10 mm intervals<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> &lt;1 mm sections<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Fast sub-second scanning improves resolution by reducing artefact from breathing or movement.<\/div><div class=\"expl-line\">Edge enhancing algorithms are used which are similar to a bone algorithm. HRCT is performed as a non-cahanced scan.<\/div><div class=\"expl-line\">1-3 mm thickness sections are advised, below this there is too much noise and signal noise falls.<\/div><\/div>","due":35},{"section":"Exam 5 b","front":"<div class=\"stem\">60. The following centering points are correct<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> DP hand — head of third metacarpal<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Oblique hand — head of third metacarpal<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Oblique view of the scaphoid - ulnar styloid<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> AP elbow - 2.5 cms distal to elbow joint<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Lateral elbow – 2.5 cms anterior to lateral epicondyle<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Oblique hand-head of fifth metacarpal<\/div><div class=\"expl-line\">Lateral elbow - lateral cpicondyle<\/div><\/div>","due":35},{"section":"Exam 5 b","front":"<div class=\"stem\">48. Regarding a 99mTc-labelled sulphur colloid scan<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The average particle size is 10-100 micrometers<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Localises bone marrow<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Tomography requires an increased dose of isotope<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The Oldentdorf technique produces a constant rate injection over several minutes<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Allows the calculation of the hepatic-portal flow ratio<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Sulphur colloid particles are 0.1-1 micrometer in size.<\/div><div class=\"expl-line\">The Oldendorf technique is designed to produce a rapid abrupt bolus.<\/div><\/div>","due":36},{"section":"Exam 5 b","front":"<div class=\"stem\">49. When performing percutaneous transhepatic cholangiogram<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Bile duct cannulation is performed with an 18G Chiba needle<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The patient should lie on their left side post procedure<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A platelet count of less than 100,000 is a contraindication<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Bile duct puncture failure occurs in 50% of non-dilated systems<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Several passes may be required, but the liver capsule should only he punctured once<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Bile duct cannulation is performed using a 22 or 23G guage needle.<\/div><div class=\"expl-line\">The patient should lie on their right after the procedure to tamponade the liver puncture site.<\/div><div class=\"expl-line\">Bile duct puncture failure occurs in around 10% of cases.<\/div><\/div>","due":36},{"section":"Exam 5 b","front":"<div class=\"stem\">51. Glucagon<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Cause severe hypertension<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Is contraindicated in insulinoma<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Usually 2 mg IV is required for adequate effects<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> It is contraindicated in diabetes mellitis<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> It is less potent smooth muscle relaxant than buscopan<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Glucogin can cause severe hypertension in patients with phacochromocytomas.<\/div><div class=\"expl-line\">The dose is 0.5 ing IV (maximum 1 mg).<\/div><\/div>","due":36},{"section":"Exam 5 b","front":"<div class=\"stem\">52. Peroral Pneumocolon technique<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Gives barium and then gas orally<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Introduce air after patient has drunk 300 ml<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> This demonstrates jejunum well<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Give laxatives and prepare colon<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Specific examination for terminal ileal disease and caecum.<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">Introduce air rectally to ileocaccal region.<\/div><div class=\"expl-line\">Wait until contrast is in the mid transvese colon before introducing the air.<\/div><div class=\"expl-line\">Terminal ileum and caecum are very well visualised. Preparation as for barium enema.<\/div><\/div>","due":36},{"section":"Exam 5 b","front":"<div class=\"stem\">42. Regarding MIBG scanning<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The isotope is 99mTc<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> MIBG taken up by catecholamine cells<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> No patient preparation is required<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Images are acquired at 4 and 24 hours<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The injection should be given over 5 minutes<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">123I is used for MIBG scans. Iodine can be used therapeutically.<\/div><div class=\"expl-line\">Tricyclic antidepressants and beta blockers should be ceased prior to the investigation. Patients require thyroid blockade<\/div><\/div>","due":37},{"section":"Exam 5 b","front":"<div class=\"stem\">43. The Following are true about ultrasound of the uterus<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The multiparous uterus should measure approximately 1 cm more in all directions than a nulliparous uterus<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The neonatal uterus is larger than the prepubertal uterus<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The normal post menopausal endometrium should measure less than 8 mms<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> In the prepubertal uterus the endometrium should measure 2-3 mms<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The cervix occupies one-third of the length of the prepubertal uterus<\/div>","back":"<div class=\"answer-title\">Answers<\/div><div class=\"ans-row\"><span class=\"letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">B.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">C.<\/span> <span class=\"verdict true\">TRUE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">D.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"ans-row\"><span class=\"letter\">E.<\/span> <span class=\"verdict false\">FALSE<\/span><\/div><div class=\"expl\"><div class=\"expl-title\">Explanation<\/div><div class=\"expl-line\">The endometrium should not be visible, and the cervix occupies two-thirds of the prepubertal uterus.<\/div><\/div>","due":38},{"section":"Exam 5 b","front":"<div class=\"stem\">41. Regarding lymphangiography<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Following unilateral injection opacification of para aortic glands on the opposite side is seen in 20%<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> &quot;Beading&quot; is due to valves in the lymph channels<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Is contraindicated if radiotherapy to the chest has
